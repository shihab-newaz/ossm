<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>OSSM</title>
  <!-- Favicon copy of components/Logo.tsx. A standalone SVG can't read the page's CSS variables, so the DESIGN.md hex values are inlined here. -->
  <style>
    .tile { fill: #17151c; }
    .ring { stroke: #ff5a1f; }
    .play { fill: #ffffff; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f4f2f7; }
      .ring { stroke: #ff6a33; }
      .play { fill: #111014; stroke: #111014; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8" />
  <path class="ring" d="M24.46 12.92A9 9 0 1 1 19.08 7.54" fill="none" stroke-width="3" stroke-linecap="round" />
  <path class="play" d="M14.25 12.5v7l5.75-3.5z" stroke-width="2" stroke-linejoin="round" />
</svg>
