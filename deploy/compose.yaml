name: ossm

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "${OSSM_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
      - storage

  web:
    build: ../web
    environment:
      API_ORIGIN: http://api:8080

  api:
    build: ../backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ossm
      DATABASE_USER: ossm
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ossm}
      STORAGE_ENDPOINT: http://storage:8333
      # What upload URLs are signed for: the address people open the site on.
      OSSM_PUBLIC_URL: ${OSSM_PUBLIC_URL:-http://localhost:${OSSM_PORT:-8080}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ossm-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ossm-secret-key}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ossm
      POSTGRES_USER: ossm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ossm}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ossm -d ossm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reference S3-compatible object store. Not published to the host: the API reaches it directly,
  # and browsers reach it only through the proxy at /ossm/* using presigned URLs.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ossm-access}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ossm-secret-key}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:
