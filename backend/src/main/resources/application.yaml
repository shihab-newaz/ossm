spring:
  application:
    name: ossm-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ossm}
    username: ${DATABASE_USER:ossm}
    password: ${DATABASE_PASSWORD:ossm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    # Flyway owns the schema (V2); sessions are stored in Postgres so they survive restarts.
    jdbc:
      initialize-schema: never
    timeout: 30d

server:
  servlet:
    session:
      cookie:
        name: OSSM_SESSION
        http-only: true
        same-site: lax
        path: /
        max-age: 30d
        # Set SESSION_COOKIE_SECURE=true when serving over HTTPS (Caddy does in production).
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
