spring:
  application:
    name: ossm-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ossm}
    username: ${DATABASE_USER:ossm}
    password: ${DATABASE_PASSWORD:ossm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    # Absent rather than null, so optional contract fields are simply missing.
    default-property-inclusion: non_null
  session:
    # Flyway owns the schema (V2); sessions are stored in Postgres so they survive restarts.
    jdbc:
      initialize-schema: never
    timeout: 30d

server:
  servlet:
    session:
      cookie:
        name: OSSM_SESSION
        http-only: true
        same-site: lax
        path: /
        max-age: 30d
        # Set SESSION_COOKIE_SECURE=true when serving over HTTPS (Caddy does in production).
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

ossm:
  storage:
    # Server-side calls to the store. The browser never uses this address.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    # What presigned URLs point at: the address the browser reaches the store on (Caddy routes it).
    public-url: ${OSSM_PUBLIC_URL:http://localhost:8080}
    bucket: ${STORAGE_BUCKET:ossm}
    access-key: ${S3_ACCESS_KEY:ossm-access}
    secret-key: ${S3_SECRET_KEY:ossm-secret-key}
  ingest:
    enabled: true
    heartbeat-interval: 15s
