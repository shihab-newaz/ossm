openapi: 3.1.0
info:
  title: OSSM API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: API and database health
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: Whether first-run setup is still needed
      description: Public. True only while no user exists.
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: completeSetup
      summary: Create the admin account and log in
      description: Only works while no user exists; afterwards it always answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Admin created and logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Setup is already complete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with username and password
      description: A wrong username and a wrong password are indistinguishable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing username or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Incorrect username or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the session
      description: Invalidates the session server-side. Idempotent.
      responses:
        "204":
          description: Logged out
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: The logged-in user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No valid session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean
    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-z0-9._-]+$"
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
    Problem:
      description: RFC 9457 problem details
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        database:
          type: string
          enum: [UP, DOWN]
