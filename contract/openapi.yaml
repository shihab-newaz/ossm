openapi: 3.1.0
info:
  title: OSSM API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: API and database health
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        database:
          type: string
          enum: [UP, DOWN]
