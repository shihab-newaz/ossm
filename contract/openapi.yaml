openapi: 3.1.0
info:
  title: OSSM API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: API and database health
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: Whether first-run setup is still needed
      description: Public. True only while no user exists.
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: completeSetup
      summary: Create the admin account and log in
      description: Only works while no user exists; afterwards it always answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Admin created and logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Setup is already complete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with username and password
      description: A wrong username and a wrong password are indistinguishable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing username or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Incorrect username or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the session
      description: Invalidates the session server-side. Idempotent.
      responses:
        "204":
          description: Logged out
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: The logged-in user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No valid session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change your own password
      description: Requires the current password. Ends every other session of this user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Wrong current password, or the new one is not acceptable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users (admin)
      responses:
        "200":
          description: All users, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
    post:
      operationId: createUser
      summary: Invite a person (admin)
      description: Creates a pending account and a one-time invite link. The person chooses their own password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Pending account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "400":
          description: Invalid username or role
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Username already taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/{id}/invite:
    post:
      operationId: reissueInvite
      summary: New invite link for a pending user (admin)
      description: Replaces any earlier link, used or not.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Fresh invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "404":
          description: No such user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The user already has a password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/{id}/deactivate:
    post:
      operationId: deactivateUser
      summary: Revoke a user's access (admin)
      description: Ends all of their sessions. You cannot deactivate yourself.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Deactivated
        "404":
          description: No such user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: You cannot deactivate yourself
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/{id}/activate:
    post:
      operationId: activateUser
      summary: Restore a deactivated user (admin)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Activated
        "404":
          description: No such user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/invites/{token}:
    get:
      operationId: getInvite
      summary: Look up an invite link
      description: Public. A used, expired or unknown token is indistinguishable.
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: A usable invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        "404":
          description: Invalid, used or expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/invites/{token}/accept:
    post:
      operationId: acceptInvite
      summary: Set a password from an invite and log in
      description: The token works once.
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          description: Account active and logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Password not acceptable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Invalid, used or expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/uploads:
    get:
      operationId: listUploads
      summary: Your recent uploads and where each one is
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Upload"
    post:
      operationId: createUpload
      summary: Start a direct-to-storage multipart upload
      description: >
        Returns presigned part URLs. The browser PUTs each part straight to the object store, then
        calls complete. The API never receives the file bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
        "400":
          description: Missing file name, or a file larger than 250 MB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/uploads/{id}:
    get:
      operationId: getUpload
      summary: One of your uploads
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The upload and its ingest status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/uploads/{id}/complete:
    post:
      operationId: completeUpload
      summary: All parts are uploaded; start ingest
      parameters:
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "202":
          description: Ingest queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          description: The object store rejected the parts
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Already completed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/uploads/{id}/retry:
    post:
      operationId: retryUpload
      summary: Try ingesting a failed upload again
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "202":
          description: Ingest queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Only failed uploads can be retried
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/ingest-failures:
    get:
      operationId: listIngestFailures
      summary: Failed uploads from everyone (admin)
      responses:
        "200":
          description: Most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestFailure"
  /api/v1/tracks:
    get:
      operationId: listTracks
      summary: Tracks in the shared library
      description: >
        Everything unless limit and offset are given. Sorted by sort (added,
        newest first; title; or artist), always with a stable tie-break, so
        pages never overlap or skip. The total is in X-Total-Count.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [added, title, artist]
            default: added
      responses:
        "200":
          description: Tracks
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
  /api/v1/albums:
    get:
      operationId: listAlbums
      summary: Albums in the shared library
      description: >
        Everything unless limit and offset are given. Sorted by sort (added,
        newest first; title; or artist) with a stable tie-break. The total is in
        X-Total-Count.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [added, title, artist]
            default: added
      responses:
        "200":
          description: Albums
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"
  /api/v1/albums/{id}:
    get:
      operationId: getAlbum
      summary: An album and its tracks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        "404":
          description: No such album
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/artists:
    get:
      operationId: listArtists
      summary: Artists in the shared library, A to Z
      description: Everything unless limit and offset are given. The total is in X-Total-Count.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: Artists
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artist"
  /api/v1/artists/{id}:
    get:
      operationId: getArtist
      summary: An artist, their albums and their tracks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistDetail"
        "404":
          description: No such artist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/tracks/{id}/stream:
    get:
      operationId: streamTrack
      summary: The audio of a track, as stored (direct play, no transcoding)
      description: >
        Proxied from the private object store. Supports a single byte range
        (start-end, open-ended, or suffix) so a player can seek. A Range header
        that is malformed, uses another unit or asks for several ranges is
        ignored and the whole file is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1023
      responses:
        "200":
          description: The whole file
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          description: No such track, or its file is missing from storage
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "416":
          description: The range starts beyond the end of the file
  /api/v1/events/playback:
    post:
      operationId: recordPlaybackEvent
      summary: Report a playback event
      description: >
        Idempotent by event id: sending the same event again answers 202 and
        stores nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackEventRequest"
      responses:
        "202":
          description: Accepted (new or already stored)
        "400":
          description: Invalid event
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such track
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The event id is already used by another event
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/history:
    get:
      operationId: listHistory
      summary: Your recent plays, newest first
      description: One entry per qualifying play, so a track played twice appears twice.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recent plays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Play"
  /api/v1/history/most-played:
    get:
      operationId: listMostPlayed
      summary: Your most played tracks
      description: Counts your qualifying plays per track, highest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Most played
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MostPlayed"
  /api/v1/albums/{id}/cover:
    get:
      operationId: getAlbumCover
      summary: Cover art for an album
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No such album or no cover
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  headers:
    TotalCount:
      description: How many there are in all, whatever the page
      schema:
        type: integer
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 1000. Leave out (with offset) for everything.
      schema:
        type: integer
    PageOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      description: How many to return (default 50, at most 200)
      schema:
        type: integer
        default: 50
    UploadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateUploadRequest:
      type: object
      required: [filename, sizeBytes]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 262144000
        license:
          type: string
          description: Defaults to All rights reserved
          enum: [All rights reserved, CC BY, CC BY-SA, CC BY-NC, CC BY-ND, CC BY-NC-SA, CC BY-NC-ND, CC0]
    UploadPart:
      type: object
      required: [partNumber, url]
      properties:
        partNumber:
          type: integer
          minimum: 1
        url:
          type: string
          description: Presigned URL to PUT this part to
    UploadTicket:
      type: object
      required: [upload, partSizeBytes, parts]
      properties:
        upload:
          $ref: "#/components/schemas/Upload"
        partSizeBytes:
          type: integer
          format: int64
        parts:
          type: array
          items:
            $ref: "#/components/schemas/UploadPart"
    CompletedPart:
      type: object
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          minimum: 1
        etag:
          type: string
    CompleteUploadRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CompletedPart"
    Upload:
      type: object
      required: [id, filename, sizeBytes, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          enum: [UPLOADING, INGESTING, DONE, FAILED, DUPLICATE]
        error:
          type: string
          description: Readable reason, present when status is FAILED
        trackId:
          type: string
          format: uuid
          description: Present when status is DONE, or DUPLICATE (the track already in the library)
        createdAt:
          type: string
          format: date-time
    IngestFailure:
      type: object
      required: [uploadId, filename, error, username, failedAt]
      properties:
        uploadId:
          type: string
          format: uuid
        filename:
          type: string
        error:
          type: string
        username:
          type: string
        failedAt:
          type: string
          format: date-time
    Track:
      type: object
      required: [id, title, artist, artistId, durationMs, license, uploadedBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        artistId:
          type: string
          format: uuid
        uploadedBy:
          type: string
          description: Username of who uploaded it
        album:
          type: string
        albumId:
          type: string
          format: uuid
        coverUrl:
          type: string
          description: Same-origin path to the album cover, when it has one
        dominantColor:
          type: string
          description: "The album cover's dominant colour as #rrggbb, when it has a cover"
        license:
          type: string
          enum: [All rights reserved, CC BY, CC BY-SA, CC BY-NC, CC BY-ND, CC BY-NC-SA, CC BY-NC-ND, CC0]
        trackNumber:
          type: integer
        year:
          type: integer
        genre:
          type: string
        durationMs:
          type: integer
          format: int64
        codec:
          type: string
        bitrateKbps:
          type: integer
        createdAt:
          type: string
          format: date-time
    Album:
      type: object
      required: [id, title, artist, artistId, trackCount, durationMs]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        artistId:
          type: string
          format: uuid
        year:
          type: integer
        coverUrl:
          type: string
        dominantColor:
          type: string
          description: "The cover dominant colour as #rrggbb, when it has a cover"
        trackCount:
          type: integer
        durationMs:
          type: integer
          format: int64
    AlbumDetail:
      type: object
      required: [album, uploadedBy, uploadedAt, tracks]
      properties:
        album:
          $ref: "#/components/schemas/Album"
        uploadedBy:
          type: string
          description: Who uploaded the first track
        uploadedAt:
          type: string
          format: date-time
          description: When the first track was added
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
    Artist:
      type: object
      required: [id, name, albumCount, trackCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        albumCount:
          type: integer
        trackCount:
          type: integer
        coverUrl:
          type: string
          description: Cover of one of their albums, when any has one
    ArtistDetail:
      type: object
      required: [artist, albums, tracks]
      properties:
        artist:
          $ref: "#/components/schemas/Artist"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/Album"
        tracks:
          type: array
          description: All their tracks, singles included
          items:
            $ref: "#/components/schemas/Track"
    PlaybackEventRequest:
      description: >
        A playback event as the player reports it. The server adds the user
        from the session and stores the whole envelope unchanged. play_completed
        is the qualifying play: sent once, at 30 seconds or half the track,
        whichever comes first.
      type: object
      required: [eventId, schemaVersion, trackId, type, occurredAt, positionMs, clientId]
      properties:
        eventId:
          type: string
          format: uuid
          description: Chosen by the client. Sending the same id again is harmless.
        schemaVersion:
          type: integer
          description: Envelope version. Currently 1.
        trackId:
          type: string
          format: uuid
        type:
          type: string
          enum: [play_started, play_completed, skipped]
        occurredAt:
          type: string
          format: date-time
          description: When it happened on the client
        positionMs:
          type: integer
          format: int64
          description: Playback position in milliseconds when it happened
        clientId:
          type: string
          description: Identifies the app instance, for example a per-browser random id
    Play:
      type: object
      required: [track, playedAt]
      properties:
        track:
          $ref: "#/components/schemas/Track"
        playedAt:
          type: string
          format: date-time
    MostPlayed:
      type: object
      required: [track, plays]
      properties:
        track:
          $ref: "#/components/schemas/Track"
        plays:
          type: integer
          format: int64
    UserSummary:
      type: object
      required: [id, username, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
        status:
          type: string
          enum: [ACTIVE, INVITED, DEACTIVATED]
        createdAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-z0-9._-]+$"
        role:
          type: string
          enum: [ADMIN, USER]
    InviteCreated:
      type: object
      required: [user, token, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        token:
          type: string
          description: Shown once. The link is /invite/{token}.
        expiresAt:
          type: string
          format: date-time
    InviteInfo:
      type: object
      required: [username]
      properties:
        username:
          type: string
    AcceptInviteRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean
    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-z0-9._-]+$"
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
    Problem:
      description: RFC 9457 problem details
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        database:
          type: string
          enum: [UP, DOWN]
